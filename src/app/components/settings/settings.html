<div class="settings-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">Ρυθμίσεις Συστήματος & Μονάδας</h1>
      <p class="page-subtitle">Διαμόρφωση στοιχείων μονάδας, ιεραρχίας υπογραφών και διαχείριση βάσης δεδομένων.</p>
    </div>
  </div>

  <div class="settings-grid">
    <!-- Unit Details Form Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Στοιχεία Στρατιωτικής Μονάδας
        </h2>
      </div>

      <div class="card-body">
        <div class="form-grid">
          <div class="form-group">
            <label class="form-label">Ονομασία Μονάδας *</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.name" placeholder="π.χ. 535 Μ/Κ ΤΠ" />
          </div>

          <div class="form-group">
            <label class="form-label">Σχηματισμός / Μεραρχία</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.division" placeholder="π.χ. 16η Μ/Κ ΜΠ" />
          </div>

          <div class="form-group full-width">
            <label class="form-label">Τοποθεσία / Έδρα Στρατοπέδου</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.location" placeholder="π.χ. Σιδηρόκαστρο Σερρών" />
          </div>

          <div class="form-group full-width">
            <label class="form-label">Ονοματεπώνυμο & Βαθμός Διοικητή *</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.commanderName" placeholder="π.χ. Αντισυνταγματάρχης (ΠΖ) Παπαδόπουλος Γεώργιος" />
          </div>

          <div class="form-group">
            <label class="form-label">Τίτλος Υπογράφοντος Αξιωματικού</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.dutyOfficerSignatureTitle" placeholder="π.χ. Ο Αξιωματικός Επιχειρήσεων" />
          </div>

          <div class="form-group">
            <label class="form-label">Ονοματεπώνυμο & Βαθμός Αξιωματικού</label>
            <input type="text" class="form-control" [(ngModel)]="unitForm.dutyOfficerName" placeholder="π.χ. Ταγματάρχης (ΠΖ) Κωνσταντίνου Δημήτριος" />
          </div>
        </div>

        <div class="mt-3">
          <button class="btn btn-primary" (click)="saveUnitInfo()">
            Αποθήκευση Στοιχείων Μονάδας
          </button>
        </div>
      </div>
    </div>

    <!-- Data Management Card -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          Διαχείριση Βάσης Δεδομένων
        </h2>
      </div>

      <div class="card-body">
        <div class="storage-details-box">
          <div class="detail-line">
            <span class="detail-label">Διαδρομή Αρχείου:</span>
            <span class="detail-value mono">{{ storage.storageFilePath() }}</span>
          </div>

          <div class="detail-line">
            <span class="detail-label">Τελευταία Αποθήκευση:</span>
            <span class="detail-value">{{ storage.lastSavedTime() || 'Ενεργή' }}</span>
          </div>
        </div>

        <div class="storage-buttons-grid">
          <button class="btn btn-secondary" (click)="createBackup()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
              <polyline points="17 21 17 13 7 13 7 21"/>
              <polyline points="7 3 7 8 15 8"/>
            </svg>
            Αντίγραφο Ασφαλείας
          </button>

          <button class="btn btn-secondary" (click)="saveAs()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            Αποθήκευση Βάσης ως...
          </button>

          <button class="btn btn-secondary" (click)="openOtherFile()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
            Άνοιγμα Άλλης Βάσης Δεδομένων
          </button>

          <button class="btn btn-secondary" (click)="resetToDefault()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
              <path d="M21 3v5h-5"/>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
              <path d="M3 21v-5h5"/>
            </svg>
            Επαναφορά Προτύπων
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
